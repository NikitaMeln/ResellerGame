<div class="game-room-container" *ngIf="roomState">
  <!-- Header with game status -->
  <app-game-header [playerState]="playerState"></app-game-header>

  <!-- Main game board -->
  <div class="game-board-layout">
    <!-- Client Zone (Top) -->
    <div class="zone clients-zone">
      <div class="card-slots">
        <div
          *ngFor="let slot of clientZone; let i = index"
          class="card-slot"
        >
          <app-game-card
            *ngIf="slot"
            [card]="slot"
            (click)="onClientClick(slot)"
          ></app-game-card>
          <div *ngIf="!slot" class="empty-slot">
            <span class="slot-placeholder"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Tuning Zone -->
    <div class="zone tuning-zone">
      <div class="card-slots">
        <div
          *ngFor="let slot of tuningZone; let i = index"
          class="card-slot tuning-card-slot"
        >
          <app-game-card
            *ngIf="slot"
            [card]="slot"
            (click)="onTuningClick(slot)"
            (cardDragStart)="onTuningDragStart($event)"
            (cardDragEnd)="onTuningDragEnd($event)"
            [class.clickable]="isMyTurn() && isTuningSelection()"
          ></app-game-card>
          <div *ngIf="!slot" class="empty-slot">
            <span class="slot-placeholder"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Market Zone (Bottom) -->
    <div class="zone market-zone">
      <div class="card-slots">
        <div
          *ngFor="let slot of marketZone; let i = index"
          class="card-slot"
        >
          <app-game-card
            *ngIf="slot"
            [card]="slot"
            (click)="onCarClick(slot)"
            (cardDragStart)="onCarDragStart($event)"
            (cardDragEnd)="onCarDragEnd($event)"
            [class.clickable]="isMyTurn() && isCarSelection()"
          ></app-game-card>
          <div *ngIf="!slot" class="empty-slot">
            <span class="slot-placeholder"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Garage Separator -->
  <div class="garage-separator">
    <span class="garage-label">Garage</span>
  </div>

  <!-- Garage Zone -->
  <div class="garage-slots-zone">
    <div class="card-slots"
         [class.drag-over]="isDraggingCar"
         (dragover)="onGarageDragOver($event)"
         (dragleave)="onGarageDragLeave($event)"
         (drop)="onGarageDrop($event)">
      <div
        *ngFor="let slot of garageZone; let i = index"
        class="card-slot garage-car-slot"
        [class.tuning-drop-target]="slot && isDraggingTuning"
        [class.tuning-hover]="slot && isGarageCarHovered(slot.id)"
        (dragover)="slot ? onGarageCarDragOver($event, slot.id) : null"
        (dragleave)="slot ? onGarageCarDragLeave($event, slot.id) : null"
        (drop)="slot ? onGarageCarDrop($event, slot.id) : null"
      >
        <app-game-card
          *ngIf="slot"
          [card]="slot"
        ></app-game-card>
        <div *ngIf="!slot" class="empty-slot">
          <span class="slot-placeholder"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Turn indicator overlay -->
  <div class="turn-indicator" *ngIf="isStarted()">
    <div *ngIf="isMyTurn()" class="your-turn-banner">
      <span class="turn-text">
        <strong>YOUR TURN!</strong>
        <span *ngIf="isCarSelection()">Select a car to buy</span>
        <span *ngIf="isTuningSelection()">Select tuning for your car or skip</span>
      </span>
      <button class="btn-skip" (click)="skipTurn()">Skip</button>
    </div>
    <div *ngIf="!isMyTurn()" class="waiting-turn">
      <p>Waiting for <strong>{{ getCurrentPlayerName() }}</strong></p>
    </div>
  </div>
</div>

<div *ngIf="!roomState" class="loading-container">
  <div class="loading-spinner"></div>
  <p>Loading room...</p>
</div>
