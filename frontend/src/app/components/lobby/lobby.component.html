<div class="lobby-container">
  <!-- Loading Screen -->
  <div class="loading-screen">
    <!-- Loader Animation -->
    <div class="loader-wrapper">
      <div class="loader">
        <div class="loader-circle"></div>
        <div class="loader-circle"></div>
        <div class="loader-circle"></div>
      </div>
    </div>

    <!-- Waiting Message -->
    <div class="waiting-info">
      <h2>Waiting for players...</h2>
      <p class="username">{{ username }}</p>
      <p class="timer">Game starts in <span class="countdown">{{ waitingTime }}</span> seconds</p>
      <p class="hint">The game will start automatically when time runs out or when all players join</p>
    </div>

    <!-- Dots Animation -->
    <div class="dots-animation">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</div>
