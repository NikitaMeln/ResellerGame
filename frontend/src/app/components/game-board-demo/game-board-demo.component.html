<div class="demo-container">
  <div class="demo-header">
    <h1>Игровое поле - Демо</h1>
    <p>Нажмите на стопку карт, чтобы развернуть её. Кликните на карту, чтобы выбрать её.</p>
  </div>

  <div class="demo-board">
    <app-game-board

    ></app-game-board>
  </div>
</div>
